[package]
name = "legion_light"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "Keyboard backlight and performance control for Lenovo Legion laptops"
license = "MIT"

[dependencies]
# xattr 0.2 (through GPUI) requires ENOATTR, removed in newer libc.
libc = "=0.2.186"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1

[features]
default = []
gui = ["dep:gpui"]
gui-tests = ["gui", "gpui/test-support"]

[dependencies.gpui]
version = "=0.2.2"
optional = true

[[bin]]
name = "legion_light"
path = "src/main.rs"
required-features = ["gui"]
